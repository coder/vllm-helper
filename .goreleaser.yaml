version: 2
project_name: llm-helper

# The dev channel publishes under a tag named "dev" that moves with every
# build. Left visible, it becomes the nearest tag and GoReleaser rejects it as
# not semver, so every dev build after the first would fail to derive a
# version. Ignoring it keeps versions coming from the last real release.
git:
  ignore_tags:
    - dev

builds:
  - &build
    id: llm-helper
    main: .
    binary: llm-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # macOS is Apple Silicon only (Intel Macs can't serve models anyway).
      - goos: darwin
        goarch: amd64
    ldflags:
      # Commit is what identifies a dev build: they all share one moving
      # release tag, so the version string can't tell two of them apart.
      - -s -w
        -X github.com/coder/vllm-helper/internal/cli.Version={{.Version}}
        -X github.com/coder/vllm-helper/internal/cli.Commit={{.FullCommit}}
  # The same binary under its old name. 'upgrade' in v0.5.0 and earlier
  # unpacks the file called vllm-helper and nothing else, so dropping it would
  # strand every existing install on the release it has.
  - <<: *build
    id: vllm-helper
    binary: vllm-helper

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Dev builds are snapshots: the same archives and checksums as a release, but
# versioned from the commit rather than a tag, because the "dev" release tag
# moves with every build. Marked so a dev build never looks like a release.
snapshot:
  version_template: "{{ incpatch .Version }}-dev.{{ .ShortCommit }}"

# Release notes come from CHANGELOG.md via --release-notes, which already
# stops GoReleaser generating a list of commit subjects. Do not disable the
# changelog to say the same thing twice: "disable" also discards the file
# passed to --release-notes, which publishes a release with an empty body.
# v0.4.0 shipped that way.
changelog:
  disable: false

release:
  github:
    owner: coder
    name: vllm-helper
  draft: false
  prerelease: auto
