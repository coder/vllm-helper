name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Markdown and YAML only: Go files are gofmt's job, below.
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install --frozen-lockfile
      - name: prettier
        run: bun run fmt:ci

  go:
    strategy:
      fail-fast: false
      matrix:
        # Both release platforms have build-tagged code, so run the tests on
        # each rather than only cross-compiling for macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build (all release targets)
        run: |
          GOOS=linux  GOARCH=arm64 go build ./...
          GOOS=linux  GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - name: test
        run: go test -race ./...

  # recipediff is a separate module so the CLI keeps its two direct
  # dependencies. The root ./... skips nested modules, so without this job the
  # tool would never be built or tested. Its tests read checked-in fixtures and
  # never touch the network.
  recipediff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: vet
        working-directory: tools/recipediff
        run: go vet ./...
      - name: test
        working-directory: tools/recipediff
        run: go test ./...
