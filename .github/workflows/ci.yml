name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build (all release targets)
        run: |
          GOOS=linux  GOARCH=arm64 go build ./...
          GOOS=linux  GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - name: test
        run: go test ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          for f in vllm-helper install.sh lib/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning vllm-helper install.sh lib/*.sh || true
