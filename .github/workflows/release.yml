name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The release body comes from CHANGELOG.md, so the notes are written and
      # reviewed in the PR that makes the change rather than generated from
      # commit subjects at tag time. A tag with no entries is a mistake worth
      # failing on: it means the changelog was never updated.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no entries under '## [$version]' -- the section is missing or empty. Move the Unreleased entries under it before tagging."
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Extracting the notes and publishing them are different things, and the
      # gap between them is silent: v0.4.0 was published with an empty body by
      # a run where the extract step above printed all 336 lines of it. Read
      # the release back and fail if the body didn't land.
      - name: Verify the published release carries the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Separate a failed read from an empty body, so an auth or API error
          # is not reported as the changelog problem below.
          if ! published="$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body')"; then
            echo "::error::Could not read back release ${GITHUB_REF_NAME} to verify its body; see the gh error above."
            exit 1
          fi
          if [ "$(printf '%s' "$published" | tr -d '[:space:]' | wc -c)" -lt 200 ]; then
            echo "::error::${GITHUB_REF_NAME} was published with an empty or truncated body, though CHANGELOG.md has a section for it. Check that changelog.disable is not set in .goreleaser.yaml."
            exit 1
          fi
